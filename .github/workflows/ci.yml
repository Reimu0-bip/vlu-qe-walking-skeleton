name: Node.js CI (Jest Tests)

on:
  push:
    branches:
      - main
  pull_request: # (Tùy chọn) Chạy test cả khi có Pull Request vào nhánh main
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # Bước 1: Lấy mã nguồn từ repository
    - name: Checkout code
      uses: actions/checkout@v4

    # Bước 2: Cài đặt môi trường Node.js
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # Bạn có thể đổi thành 18 hoặc phiên bản dự án đang dùng
        cache: 'npm'       # Giúp tăng tốc độ cho các lần chạy sau

    # Bước 3: Cài đặt các thư viện (bao gồm Jest trong devDependencies)
    - name: Cài đặt dependencies
      run: npm install

    # Bước 4: Chạy bài test đã cấu hình trong package.json
    - name: Chạy Unit Test bằng Jest
      run: npm test
